#challenger.punch-attack{animation:punchRush .65s ease-out}#challenger.kick-attack{animation:kickRush .7s ease-out}#challenger.special-attack{animation:specialRush .8s ease-out}#boss.punch-hit{animation:punchHit .65s ease-out}#boss.kick-hit{animation:kickHit .7s ease-out}#boss.special-hit{animation:specialHit .8s ease-out}.arena.punch-flash{animation:punchFlash .55s}.arena.kick-flash{animation:kickFlash .65s}.arena.special-flash{animation:specialFlash .8s}#effect.special-effect{font-size:34px;color:#fff;text-shadow:0 0 12px #ff1e1e,3px 3px #ffba00,-3px -3px #ff4a00}@keyframes punchRush{0%,100%{transform:translateX(0)}45%{transform:translateX(115px) rotate(-12deg)}65%{transform:translateX(85px)}}@keyframes kickRush{0%,100%{transform:translateX(0) rotate(0)}45%{transform:translateX(125px) rotate(-32deg) scale(1.15)}70%{transform:translateX(90px) rotate(12deg)}}@keyframes specialRush{0%,100%{transform:translateX(0) scale(1)}30%{transform:translateX(35px) scale(1.2)}60%{transform:translateX(135px) scale(1.45) rotate(-25deg)}}@keyframes punchHit{35%{transform:translateX(22px) rotate(18deg)}65%{transform:translateX(8px) rotate(-8deg)}}@keyframes kickHit{45%{transform:translate(34px,-25px) rotate(35deg)}70%{transform:translate(15px,-10px) rotate(-12deg)}}@keyframes specialHit{45%{transform:translate(65px,-48px) rotate(75deg) scale(.82)}75%{transform:translate(18px,-8px) rotate(-20deg)}}@keyframes punchFlash{45%{filter:brightness(1.5)}}@keyframes kickFlash{45%{filter:brightness(1.8) hue-rotate(35deg)}}@keyframes specialFlash{25%,65%{filter:brightness(2.4) saturate(2)}45%{filter:brightness(.65)}}

const names=['崖っぷち！チキンレース','夜露死苦！タイマン勝負','リーゼントタワー'];
function openGame(i){document.querySelectorAll('iframe').forEach((f,j)=>f.classList.toggle('active',i===j));document.getElementById('current').textContent=names[i];document.body.classList.add('in-game');history.pushState({game:i},'', '#game'+(i+1));}
function goHome(){document.body.classList.remove('in-game');document.querySelectorAll('iframe').forEach(f=>f.classList.remove('active'));history.replaceState({},'',location.pathname+location.search);}
window.addEventListener('popstate',()=>{const m=location.hash.match(/^#game([123])$/);if(m)openGameNoHistory(Number(m[1])-1);else goHome();});
function openGameNoHistory(i){document.querySelectorAll('iframe').forEach((f,j)=>f.classList.toggle('active',i===j));document.getElementById('current').textContent=names[i];document.body.classList.add('in-game');}
if(location.hash.match(/^#game[123]$/))openGameNoHistory(Number(location.hash.slice(-1))-1);
</script></body></html>
